<!-- Exercise 15.1: Border utilities – border, border-primary, border-3, rounded-circle on images -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 15.1 - Border Utilities</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-4">
        <h2 class="mb-4">Border Utilities</h2>
        <div class="d-flex flex-wrap gap-4 mb-4">
            <div class="text-center">
                <img src="https://placehold.co/100x100/6c757d/ffffff?text=1" class="border" alt="border">
                <p class="small mt-1">border</p>
            </div>
            <div class="text-center">
                <img src="https://placehold.co/100x100/0d6efd/ffffff?text=2" class="border border-primary"
                    alt="border-primary">
                <p class="small mt-1">border-primary</p>
            </div>
            <div class="text-center">
                <img src="https://placehold.co/100x100/dc3545/ffffff?text=3" class="border border-danger"
                    alt="border-danger">
                <p class="small mt-1">border-danger</p>
            </div>
            <div class="text-center">
                <img src="https://placehold.co/100x100/198754/ffffff?text=4" class="border border-success border-3"
                    alt="border-3">
                <p class="small mt-1">border-3</p>
            </div>
            <div class="text-center">
                <img src="https://placehold.co/100x100/fd7e14/ffffff?text=5"
                    class="rounded-circle border border-warning border-3" alt="rounded-circle">
                <p class="small mt-1">rounded-circle</p>
            </div>
            <div class="text-center">
                <img src="https://placehold.co/100x100/0dcaf0/000000?text=6" class="rounded border border-info border-2"
                    alt="rounded">
                <p class="small mt-1">rounded</p>
            </div>
            <div class="text-center">
                <img src="https://placehold.co/150x100/6610f2/ffffff?text=7"
                    class="rounded-pill border border-secondary border-2" alt="rounded-pill">
                <p class="small mt-1">rounded-pill</p>
            </div>
        </div>
        <h5>Border on Divs</h5>
        <div class="d-flex flex-wrap gap-3 mb-4">
            <div class="p-3 border-top border-primary border-3">border-top</div>
            <div class="p-3 border-bottom border-success border-3">border-bottom</div>
            <div class="p-3 border-start border-danger border-3">border-start</div>
]            <div class="p-3 border-end border-warning border-3">border-end</div>
            <div class="p-3 border border-0 bg-light">border-0 (no border)</div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
