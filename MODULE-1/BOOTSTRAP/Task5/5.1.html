<!-- Exercise 5.1: Centering content with justify-content-center and align-items-center -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 5.1 - Grid Alignment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .tall-row {
            min-height: 200px;
            background: #f0f0f0;
        }
    </style>
</head>

<body>
    <div class="container mt-4">
        <h2 class="mb-3">Alignment Utilities in Grid</h2>
        <h5>justify-content-center (horizontal)</h5>
        <div class="row justify-content-center g-2 mb-4">
            <div class="col-4">
                <div class="bg-primary text-white p-3 rounded text-center">col-4</div>
            </div>
            <div class="col-4">
                <div class="bg-success text-white p-3 rounded text-center">col-4</div>
            </div>
        </div>
        <h5>align-items-center (vertical)</h5>
        <div class="row align-items-center tall-row g-2 mb-4">
            <div class="col-4">
                <div class="bg-danger text-white p-3 rounded text-center" style="height:60px">Short</div>
            </div>
            <div class="col-4">
                <div class="bg-warning p-3 rounded text-center" style="height:120px">Tall</div>
            </div>
            <div class="col-4">
                <div class="bg-info p-3 rounded text-center" style="height:80px">Medium</div>
            </div>
        </div>
        <h5>justify-content-center + align-items-center (both axes)</h5>
        <div class="row justify-content-center align-items-center tall-row">
            <div class="col-auto">
                <div class="bg-dark text-white p-4 rounded">Centered Both Ways</div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
