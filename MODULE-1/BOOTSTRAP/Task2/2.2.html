<!-- Exercise 2.2: Including bootstrap.bundle.min.js for JavaScript plugin support -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 2.2 - Bootstrap JS Plugins via Bundle</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h2 class="mb-3">Bootstrap JS Plugins via bundle</h2>
        <h5 class="mt-3">Tooltip (requires Popper via bundle)</h5>
        <button type="button" class="btn btn-secondary" data-bs-toggle="tooltip" data-bs-placement="top"
            title="I am a tooltip!">
            Hover me for Tooltip
        </button>
        <h5 class="mt-4">Collapse Plugin</h5>
        <button class="btn btn-primary" data-bs-toggle="collapse" data-bs-target="#collapseDemo">
            Toggle Collapse
        </button>
        <div class="collapse mt-2" id="collapseDemo">
            <div class="card card-body">Collapsed content revealed by the Collapse plugin!</div>
        </div>
        <h5 class="mt-4">Offcanvas Plugin</h5>
        <button class="btn btn-info" data-bs-toggle="offcanvas" data-bs-target="#offcanvasDemo">
            Open Offcanvas
        </button>
        <div class="offcanvas offcanvas-start" id="offcanvasDemo">
            <div class="offcanvas-header">
                <h5 class="offcanvas-title">Offcanvas Panel</h5>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas" title="Close offcanvas"></button>
            </div>
            <div class="offcanvas-body">Offcanvas content goes here.</div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const tooltipEls = document.querySelectorAll('[data-bs-toggle="tooltip"]');
        tooltipEls.forEach(el => new bootstrap.Tooltip(el));
    </script>
</body>
</html>
