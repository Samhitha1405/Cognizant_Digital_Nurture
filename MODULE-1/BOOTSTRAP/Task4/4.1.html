<!-- Exercise 4.1: Two-column layout – sidebar (col-md-3) and content area (col-md-9) -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 4.1 - Sidebar and Content Layout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h2 class="mb-3">Sidebar + Content Layout</h2>
        <div class="row">
            <div class="col-md-3">
                <div class="bg-dark text-white p-3 rounded">
                    <h5>Sidebar</h5>
                    <ul class="list-unstyled">
                        <li><a href="#" class="text-white">Dashboard</a></li>
                        <li><a href="#" class="text-white">Profile</a></li>
                        <li><a href="#" class="text-white">Settings</a></li>
                        <li><a href="#" class="text-white">Logout</a></li>
                    </ul>
                </div>
            </div>
            <div class="col-md-9">
                <div class="bg-light p-4 rounded">
                    <h4>Main Content Area</h4>
                    <p>This area takes up 9 out of 12 columns on medium and larger screens. On mobile it stacks below
                        the sidebar.</p>
                    <div class="alert alert-info">col-md-3 + col-md-9 = 12 columns total</div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
