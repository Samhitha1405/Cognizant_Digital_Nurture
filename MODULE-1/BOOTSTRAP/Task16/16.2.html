<!-- Exercise 16.2: Overlay a badge over an image using position-relative and position-absolute -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 16.2 - Position Overlay Badge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-4">
        <h2 class="mb-4">Badge Overlaid on Image using Position Utilities</h2>
        <div class="row g-4">
            <div class="col-md-4">
                <div class="position-relative d-inline-block">
                    <img src="https://placehold.co/300x200/0d6efd/ffffff?text=Product+Image" class="img-fluid rounded"
                        alt="Product">
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                        99+
                    </span>
                </div>
                <p class="mt-2">Badge at top-right corner (top-0 start-100 translate-middle)</p>
            </div>
            <div class="col-md-4">
                <div class="position-relative d-inline-block">
                    <img src="https://placehold.co/300x200/198754/ffffff?text=Sale+Item" class="img-fluid rounded"
                        alt="Sale">
                    <span class="position-absolute top-0 start-0 badge bg-warning text-dark m-2 rounded-pill">
                        SALE
                    </span>
                </div>
                <p class="mt-2">Badge at top-left (top-0 start-0 with m-2)</p>
            </div>
            <div class="col-md-4">
                <div class="position-relative d-inline-block">
                    <img src="https://placehold.co/300x200/dc3545/ffffff?text=Avatar" class="img-fluid rounded-circle"
                        alt="Avatar" style="width:120px;height:120px;object-fit:cover">
                    <span class="position-absolute bottom-0 end-0 badge rounded-circle bg-success p-2"
                        style="width:20px;height:20px">
                    </span>
                </div>
                <p class="mt-2">Online dot at bottom-right (bottom-0 end-0)</p>
            </div>
            <div class="col-md-6">
                <div class="position-relative">
                    <img src="https://placehold.co/400x200/343a40/ffffff?text=" class="img-fluid rounded" alt="Overlay">
                    <div class="position-absolute top-50 start-50 translate-middle text-white text-center w-100">
                        <h4 class="fw-bold">Text Overlay</h4>
                        <p class="small">Centered with top-50 start-50 translate-middle</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
