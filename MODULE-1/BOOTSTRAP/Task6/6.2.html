<!-- Exercise 6.2: justify-content-between and align-items-center in a card layout -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 6.2 - Flexbox Card Layout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-4">
        <h2 class="mb-3">Flexbox in Card Layout</h2>
        <div class="card mb-3">
            <div class="card-body d-flex justify-content-between align-items-center">
                <div>
                    <h5 class="card-title mb-0">John Doe</h5>
                    <small class="text-muted">Frontend Developer</small>
                </div>
                <button class="btn btn-primary btn-sm">Follow</button>
            </div>
        </div>
        <div class="card mb-3">
            <div class="card-body d-flex justify-content-between align-items-center">
                <div>
                    <h6 class="mb-0">Wireless Headphones</h6>
                    <small class="text-muted">In stock</small>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <span class="fw-bold text-success">$49.99</span>
                    <button class="btn btn-outline-primary btn-sm">Add to Cart</button>
                </div>
            </div>
        </div>
        <div class="card border-info mb-3">
            <div class="card-body d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center gap-2">
                    <span class="badge bg-info text-dark">ℹ</span>
                    <span>Your profile was updated successfully.</span>
                </div>
                <button type="button" class="btn-close" aria-label="Close"></button>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
