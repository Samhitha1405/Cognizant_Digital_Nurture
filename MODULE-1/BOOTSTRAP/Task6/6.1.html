<!-- Exercise 6.1: Responsive navbar using d-flex, flex-column, flex-md-row -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 6.1 - Flexbox Navbar</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <!-- Custom navbar using flexbox utilities instead of navbar component -->
    <nav class="bg-dark p-3">
        <!-- d-flex: enables flexbox, flex-column: stack vertically on mobile, flex-md-row: side by side on md+ -->
        <div class="d-flex flex-column flex-md-row align-items-md-center gap-3">
            <!-- Brand logo/name -->
            <span class="text-white fw-bold fs-5">MyBrand</span>
            <!-- Nav links stacked on mobile, inline on desktop -->
            <div class="d-flex flex-column flex-md-row gap-2">
                <a href="#" class="text-white text-decoration-none">Home</a>
                <a href="#" class="text-white text-decoration-none">About</a>
                <a href="#" class="text-white text-decoration-none">Services</a>
                <a href="#" class="text-white text-decoration-none">Contact</a>
            </div>
            <!-- ms-md-auto pushes this to the far right on desktop -->
            <div class="ms-md-auto">
                <a href="#" class="btn btn-outline-light btn-sm">Login</a>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <p class="text-muted">Resize the window to see flex-column (mobile) vs flex-md-row (desktop).</p>
    </div>
    <!-- Bootstrap JS bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
