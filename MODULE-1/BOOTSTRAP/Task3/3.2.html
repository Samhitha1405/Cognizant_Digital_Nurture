<!-- Exercise 3.2: Using .container, .row, and .col-* for responsive design -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 3.2 - Container Row Col Classes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h2>Container → Row → Col</h2>
        <div class="row g-2 mt-3">
            <div class="col">
                <div class="bg-primary text-white p-3 rounded">col</div>
            </div>
            <div class="col">
                <div class="bg-success text-white p-3 rounded">col</div>
            </div>
            <div class="col">
                <div class="bg-danger text-white p-3 rounded">col</div>
            </div>
        </div>
        <div class="row g-2 mt-3">
            <div class="col-6">
                <div class="bg-warning p-3 rounded">col-6</div>
            </div>
            <div class="col-6">
                <div class="bg-info p-3 rounded">col-6</div>
            </div>
        </div>
        <div class="row g-2 mt-3">
            <div class="col-sm-4">
                <div class="bg-secondary text-white p-3 rounded">col-sm-4</div>
            </div>
            <div class="col-sm-8">
                <div class="bg-dark text-white p-3 rounded">col-sm-8</div>
            </div>
        </div>
    </div>
    <div class="container-fluid bg-light mt-4 p-3">
        <p class="mb-0"><code>.container-fluid</code> stretches to full viewport width.</p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
