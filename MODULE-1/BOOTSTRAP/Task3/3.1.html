<!-- Exercise 3.1: Responsive grid – stacked on mobile, 2/row tablet, 3/row desktop -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 3.1 - Responsive Grid Columns</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-4">
        <h2 class="mb-3">Responsive Grid Layout</h2>
        <div class="row g-3">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="p-3 bg-primary text-white rounded">Column 1</div>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
                <div class="p-3 bg-success text-white rounded">Column 2</div>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
                <div class="p-3 bg-danger text-white rounded">Column 3</div>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
                <div class="p-3 bg-warning rounded">Column 4</div>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
                <div class="p-3 bg-info rounded">Column 5</div>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
                <div class="p-3 bg-secondary text-white rounded">Column 6</div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
