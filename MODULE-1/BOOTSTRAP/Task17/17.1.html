<!-- Exercise 17.1: Bootstrap Icons – social media icons in the footer -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 17.1 - Bootstrap Icons in Footer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-4">
        <h2>Page Content</h2>
        <p>This page demonstrates Bootstrap Icons used in a footer component.</p>
        <h5 class="mt-4">Inline Icon Examples</h5>
        <p><i class="bi bi-heart-fill text-danger"></i> bi-heart-fill</p>
        <p><i class="bi bi-star-fill text-warning"></i> bi-star-fill</p>
        <p><i class="bi bi-check-circle-fill text-success"></i> bi-check-circle-fill</p>
        <p><i class="bi bi-exclamation-triangle-fill text-warning"></i> bi-exclamation-triangle-fill</p>
    </div>
    <footer class="bg-dark text-white mt-5 py-4">
        <div class="container">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <h5 class="fw-bold">MyWebsite</h5>
                    <p class="text-muted small">Building modern web experiences with Bootstrap 5.</p>
                </div>
                <div class="col-md-6 text-md-end mb-3">
                    <h6 class="text-uppercase text-muted small mb-2">Follow us</h6>
                    <a href="#" class="text-white me-3 text-decoration-none">
                        <i class="bi bi-facebook fs-4"></i>
                    </a>
                    <a href="#" class="text-white me-3 text-decoration-none">
                        <i class="bi bi-twitter-x fs-4"></i>
                    </a>
                    <a href="#" class="text-white me-3 text-decoration-none">
                        <i class="bi bi-instagram fs-4"></i>
                    </a>
                    <a href="#" class="text-white me-3 text-decoration-none">
                        <i class="bi bi-linkedin fs-4"></i>
                    </a>
                    <a href="#" class="text-white me-3 text-decoration-none">
                        <i class="bi bi-youtube fs-4"></i>
                    </a>
                    <a href="#" class="text-white text-decoration-none">
                        <i class="bi bi-github fs-4"></i>
                    </a>
                </div>
            </div>
            <hr class="border-secondary">
            <p class="text-muted small text-center mb-0">© 2025 MyWebsite. All rights reserved.</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
