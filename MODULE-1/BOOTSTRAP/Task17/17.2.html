<!-- Exercise 17.2: Replace text buttons with icon-only buttons using Bootstrap Icons -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 17.2 - Icon-Only Buttons</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-4">
        <h2 class="mb-4">Icon-Only Buttons</h2>
        <h5>Text Buttons (original)</h5>
        <div class="d-flex gap-2 mb-4">
            <button class="btn btn-primary">Edit</button>
            <button class="btn btn-danger">Delete</button>
            <button class="btn btn-success">Save</button>
            <button class="btn btn-secondary">Share</button>
            <button class="btn btn-info">Search</button>
        </div>
        <h5>Icon-Only Buttons (replacement)</h5>
        <div class="d-flex gap-2 mb-4">
            <button class="btn btn-primary" aria-label="Edit"><i class="bi bi-pencil-fill"></i></button>
            <button class="btn btn-danger" aria-label="Delete"><i class="bi bi-trash3-fill"></i></button>
            <button class="btn btn-success" aria-label="Save"><i class="bi bi-floppy-fill"></i></button>
            <button class="btn btn-secondary" aria-label="Share"><i class="bi bi-share-fill"></i></button>
            <button class="btn btn-info" aria-label="Search"><i class="bi bi-search"></i></button>
        </div>
        <h5>Icon + Text Buttons</h5>
        <div class="d-flex flex-wrap gap-2 mb-4">
            <button class="btn btn-primary"><i class="bi bi-pencil-fill me-1"></i> Edit</button>
            <button class="btn btn-danger"><i class="bi bi-trash3-fill me-1"></i> Delete</button>
            <button class="btn btn-success"><i class="bi bi-floppy-fill me-1"></i> Save</button>
            <button class="btn btn-outline-secondary"><i class="bi bi-share me-1"></i> Share</button>
            <button class="btn btn-outline-info"><i class="bi bi-download me-1"></i> Download</button>
        </div>
        <h5>Icon Button Toolbar</h5>
        <div class="btn-toolbar mb-4" role="toolbar">
            <div class="btn-group me-2" role="group">
                <button class="btn btn-outline-secondary" title="Bold"><i class="bi bi-type-bold"></i></button>
                <button class="btn btn-outline-secondary" title="Italic"><i class="bi bi-type-italic"></i></button>
                <button class="btn btn-outline-secondary" title="Underline"><i
                        class="bi bi-type-underline"></i></button>
            </div>
            <div class="btn-group me-2" role="group">
                <button class="btn btn-outline-secondary" title="Align Left"><i class="bi bi-text-left"></i></button>
                <button class="btn btn-outline-secondary" title="Align Center"><i
                        class="bi bi-text-center"></i></button>
                <button class="btn btn-outline-secondary" title="Align Right"><i class="bi bi-text-right"></i></button>
            </div>
            <div class="btn-group" role="group">
                <button class="btn btn-outline-secondary" title="Undo"><i
                        class="bi bi-arrow-counterclockwise"></i></button>
                <button class="btn btn-outline-secondary" title="Redo"><i class="bi bi-arrow-clockwise"></i></button>
            </div>
        </div>
        <h5>Circular Icon Buttons</h5>
        <div class="d-flex gap-2">
            <button class="btn btn-primary rounded-circle" style="width:45px;height:45px" aria-label="Home"><i
                    class="bi bi-house-fill"></i></button>
            <button class="btn btn-success rounded-circle" style="width:45px;height:45px" aria-label="Add"><i
                    class="bi bi-plus-lg"></i></button>
            <button class="btn btn-warning rounded-circle" style="width:45px;height:45px" aria-label="Notification"><i
                    class="bi bi-bell-fill"></i></button>
            <button class="btn btn-danger rounded-circle" style="width:45px;height:45px" aria-label="Close"><i
                    class="bi bi-x-lg"></i></button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
