<!-- Exercise 9.2: Button groups using btn-group and toggle buttons with checkboxes -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 9.2 - Button Groups and Toggle Buttons</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-4">
        <h2 class="mb-4">Button Groups & Toggle Buttons</h2>
        <h5>Basic Button Group</h5>
        <div class="btn-group mb-4" role="group" aria-label="Basic button group">
            <button type="button" class="btn btn-primary">Left</button>
            <button type="button" class="btn btn-primary">Middle</button>
            <button type="button" class="btn btn-primary">Right</button>
        </div>
        <h5>Outlined Button Group</h5>
        <div class="btn-group mb-4" role="group">
            <button type="button" class="btn btn-outline-secondary">Copy</button>
            <button type="button" class="btn btn-outline-secondary">Cut</button>
            <button type="button" class="btn btn-outline-secondary">Paste</button>
        </div>
        <h5>Mixed Color Group</h5>
        <div class="btn-group mb-4" role="group">
            <button type="button" class="btn btn-success">Accept</button>
            <button type="button" class="btn btn-warning">Review</button>
            <button type="button" class="btn btn-danger">Reject</button>
        </div>
        <h5>Button Toolbar</h5>
        <div class="btn-toolbar mb-4" role="toolbar" aria-label="Button toolbar">
            <div class="btn-group me-2" role="group">
                <button type="button" class="btn btn-outline-secondary">1</button>
                <button type="button" class="btn btn-outline-secondary">2</button>
                <button type="button" class="btn btn-outline-secondary">3</button>
            </div>
            <div class="btn-group me-2" role="group">
                <button type="button" class="btn btn-outline-secondary">4</button>
                <button type="button" class="btn btn-outline-secondary">5</button>
            </div>
            <div class="btn-group" role="group">
                <button type="button" class="btn btn-outline-secondary">6</button>
            </div>
        </div>
        <h5>Vertical Button Group</h5>
        <div class="btn-group-vertical mb-4" role="group">
            <button type="button" class="btn btn-outline-primary">Top</button>
            <button type="button" class="btn btn-outline-primary">Middle</button>
            <button type="button" class="btn btn-outline-primary">Bottom</button>
        </div>
        <h5>Checkbox Toggle Buttons</h5>
        <div class="btn-group mb-4" role="group" aria-label="Checkbox toggle buttons">
            <input type="checkbox" class="btn-check" id="cbtn1" autocomplete="off">
            <label class="btn btn-outline-primary" for="cbtn1">HTML</label>
            <input type="checkbox" class="btn-check" id="cbtn2" autocomplete="off">
            <label class="btn btn-outline-primary" for="cbtn2">CSS</label>
            <input type="checkbox" class="btn-check" id="cbtn3" autocomplete="off">
            <label class="btn btn-outline-primary" for="cbtn3">JavaScript</label>
        </div>
        <h5>Radio Toggle Buttons</h5>
        <div class="btn-group mb-4" role="group" aria-label="Radio toggle buttons">
            <input type="radio" class="btn-check" name="planRadio" id="plan1" autocomplete="off" checked>
            <label class="btn btn-outline-success" for="plan1">Monthly</label>
            <input type="radio" class="btn-check" name="planRadio" id="plan2" autocomplete="off">
            <label class="btn btn-outline-success" for="plan2">Quarterly</label>
            <input type="radio" class="btn-check" name="planRadio" id="plan3" autocomplete="off">
            <label class="btn btn-outline-success" for="plan3">Yearly</label>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
